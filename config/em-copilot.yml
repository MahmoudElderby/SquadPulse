# Live squad config for Automations. Secrets only via env (names below).
# Board filters (ORDER BY stripped at runtime):
#   Orion: project = MTN AND "squad[dropdown]" = Orion ORDER BY Rank ASC  (board 35)
#   Cobra: project = MTN AND "squad[dropdown]" = Cobra ORDER BY Rank ASC  (board 36)
jira:
  baseUrl: https://paysky1.atlassian.net

slack:
  managerDestination: C0BN9N9LZ2A
  onDemandReplyInThread: true

schedule:
  timezone: Africa/Cairo
  workingDays: [1, 2, 3, 4, 5]
  dailyBriefingTime: "08:30"

secrets:
  envVarNames:
    jiraBaseUrl: JIRA_BASE_URL
    jiraEmail: JIRA_EMAIL
    jiraApiToken: JIRA_API_TOKEN
    slackBotToken: SLACK_BOT_TOKEN

squads:
  - id: orion
    displayName: Orion
    aliases:
      - orion
    projectKeys:
      - MTN
    boardFilterJql: project = MTN AND "squad[dropdown]" = Orion
    scrumBoardId: 35
    statusCategories:
      notStarted:
        - To Do
        - Backlog
      inProgress:
        - In Progress
        - Development
      blocked:
        - Blocked
      reviewOrHandoff:
        - In Review
        - QA
      done:
        - Done
        - Closed
    priorityMapping:
      P0:
        - Highest
        - Blocker
      P1:
        - High
      P2:
        - Medium
      P3:
        - Low
      P4:
        - Lowest
    dependencyLinkTypes:
      - blocks
      - is blocked by
    thresholds:
      staleInProgressBusinessDays: 5
      noMeaningfulUpdateBusinessDays: 3
      maxInProgressPerPerson: 3

  - id: cobra
    displayName: Cobra
    aliases:
      - cobra
    projectKeys:
      - MTN
    boardFilterJql: project = MTN AND "squad[dropdown]" = Cobra
    scrumBoardId: 36
    statusCategories:
      notStarted:
        - To Do
        - Backlog
      inProgress:
        - In Progress
        - Development
      blocked:
        - Blocked
      reviewOrHandoff:
        - In Review
        - QA
      done:
        - Done
        - Closed
    priorityMapping:
      P0:
        - Highest
        - Blocker
      P1:
        - High
      P2:
        - Medium
      P3:
        - Low
      P4:
        - Lowest
    dependencyLinkTypes:
      - blocks
      - is blocked by
    thresholds:
      staleInProgressBusinessDays: 5
      noMeaningfulUpdateBusinessDays: 3
      maxInProgressPerPerson: 3
